const source="Прочетете внимателно художествения откъс и изпълнете задачите към него.\nСтарата часовникарска работилница на майстор Кирил се намираше в най-тясната уличка зад площада, там, гдето слънцето стигаше само за час по пладне. Върху тезгяха му, под стъклен похлупак, лежаха разглобени колелца, миниатюрни пружинки и стрелки, сякаш изронени от самото време. Майсторът работеше винаги с лупа на едното око и с леко наведена глава, а пръстите му – напукани и едри – пипаха дребните части с неочаквана, почти бащинска нежност.\nВ дъждовния вторник вратата иззвъня тихо и вътре влезе момче на десетина години, стиснало в шепа смачкан носен вързоп. Беше с протрито палто, чиито ръкави отдавна не стигаха до китките му. Без да продума, то разви кърпата и сложи върху тезгяха стар сребърен джобен часовник с пукнато стъкло и застинали на четири без десет стрелки.\n– От дядо ми е – прошепна момчето и преглътна. – Спря вчера. Аз... имам само тези стотинки, но ако не стигат, мога да мета пред дюкяна всяка сутрин.\nМайстор Кирил сне лупата, погледна първо момчето, после изтъркания сребърен капак, на който личеше полуизтрит гравиран кръст. Пръстите му потрепнаха. Той бавно избута шепата дребни монети обратно към ръба на тезгяха.\n– Този механизъм не иска пари, момче – рече тихо старецът и запали настолната лампа, макар денят още да не беше угаснал. – Иска само търпение. Ела в петък.";document.querySelector('#story').textContent=source;

function clock(run=false){return `<svg class="clock" viewBox="0 0 300 330" aria-label="Старинен часовник"><defs><radialGradient id="metal"><stop stop-color="#fff7dc"/><stop offset=".75" stop-color="#a7a59c"/><stop offset="1" stop-color="#635d51"/></radialGradient></defs><ellipse cx="150" cy="21" rx="22" ry="16" fill="none" stroke="#d1b16c" stroke-width="9"/><rect x="134" y="30" width="32" height="25" rx="6" fill="#bca16b"/><circle cx="150" cy="150" r="123" fill="url(#metal)" stroke="#77613d" stroke-width="5"/><circle cx="150" cy="150" r="109" fill="#f8efd9" stroke="#a68a52" stroke-width="3"/>${Array.from({length:60},(_,i)=>{let a=i*Math.PI/30;return `<line x1="${150+Math.sin(a)*99}" y1="${150-Math.cos(a)*99}" x2="${150+Math.sin(a)*(i%5?95:89)}" y2="${150-Math.cos(a)*(i%5?95:89)}" stroke="#6c583c" stroke-width="${i%5?1:3}"/>`}).join('')}${Array.from({length:12},(_,i)=>`<text x="${150+78*Math.sin(i*Math.PI/6)}" y="${156-78*Math.cos(i*Math.PI/6)}" text-anchor="middle" font-size="19" fill="#4e4231">${i||12}</text>`).join('')}<g ${run?'class="tick"':''}><path d="M150 150 L210 145 M150 150 L78 108" stroke="#263f3d" stroke-width="6" stroke-linecap="round"/></g><circle cx="150" cy="150" r="7" fill="#a57c37"/>${run?'':`<path d="M241 78 L196 121 210 151 164 178 181 223 M196 121 L158 102 142 64 M210 151 L247 166" fill="none" stroke="#8c9695" stroke-width="1.6"/>`}<text x="150" y="305" text-anchor="middle" font-size="17" fill="#9b692a">${run?'ВРЕМЕТО ОЖИВЯ':'03 : 50'}</text></svg>`}
function sparks(){let panel=document.querySelector('.panel');if(!panel)return;for(let i=0;i<12;i++){let el=document.createElement('span');el.className='spark';el.textContent='✦';el.style.left=(10+i*7)+'%';el.style.top=(30+(i%4)*12)+'%';el.style.animationDelay=(i%5)*.08+'s';panel.append(el);setTimeout(()=>el.remove(),1900)}}function progress(){ $('#progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="gear ${i<done?'on':''}">⚙</span>`).join('')+` <span>${done}/5</span><div class="bar"><i style="width:${done*20}%"></i></div>`}function panel(s){$('#main').innerHTML='<section class="panel">'+s+'</section>';progress();window.scrollTo(0,0);if(s.includes("reward"))sparks()}function start(){locked=false;selected=null;stage=1;q=0;done=0;placed=[];matched=[];picks=[];render()}function home(){done=0;panel(`<div class="hero"><div><div class="eyebrow">Литературно приключение</div><h1>Литературни детективи</h1><h2>Тайната на стария часовник</h2><p>Старият часовник е спрял. Изпълнете пет мисии, открийте фактите и разгадайте скритите послания!</p><button class="next" onclick="start()">Започни мисията →</button></div>${scene()}</div>`)}
const quiz={1:[['Къде се намира работилницата на майстор Кирил?','В най-тясната уличка зад площада.','До училището.','До гарата.'],['Кога се развива действието?','В дъждовен вторник.','В слънчев понеделник.','В снежна неделя.'],['Какъв предмет носи момчето?','Стар сребърен джобен часовник с пукнато стъкло.','Златен пръстен.','Стара книга.'],['Какво предлага момчето, ако парите не стигат?','Да мете пред дюкяна всяка сутрин.','Да донесе още пари.','Да подари часовника.']],4:[['Кой цитат показва, че часовникът е семеен спомен?','„От дядо ми е – прошепна момчето и преглътна.“','„Майсторът работеше винаги с лупа на едното око...“','„В дъждовния вторник вратата иззвъня тихо...“'],['Кой цитат доказва, че момчето е готово да се труди?','„...ако не стигат, мога да мета пред дюкяна всяка сутрин.“','„Пръстите му потрепнаха.“','„Иска само търпение.“']],5:[['Защо майстор Кирил приема да поправи часовника безплатно?','Защото проявява състрадание и разбира колко ценен е семейният спомен.','Защото часовникът е много скъп.','Защото не обича да получава пари.']]};const titles=['','Ловци на факти','Пряка или скрита информация?','Разгадай художествения детайл','Открий доказателството','Разкрий тайната'];function head(){return `<div class="eyebrow">Мисия ${stage} / 5</div><h2>${titles[stage]}</h2>`}function fb(s){$('#feedback').textContent=s}function render(){locked=false;selected=null;if(stage===2)return sortGame();if(stage===3)return matchGame();if(stage===5&&q===1)return evidence();let a=quiz[stage][q];panel(head()+`<div class="mission-layout"><div><div class="eyebrow">Въпрос ${q+1} / ${quiz[stage].length}</div><p class="question">${a[0]}</p><div class="options">${shuffle(a.slice(1).map((v,i)=>({v,i}))).map(o=>`<button class="option" onclick="answer(this,${o.i})">${o.v}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div id="next"></div><div class="clear"></div></div>${side()}</div>`)}function answer(b,i){if(locked)return;if(i){b.classList.add('wrong');tone(false);fb('Помислете още малко. Потърсете доказателство в текста!');return}locked=true;b.classList.add('correct');tone(true);fb('Браво! Верен отговор.');$('#next').innerHTML='<button class="next" onclick="advance()">Продължи →</button>'}function advance(){q++;if(q<quiz[stage].length||stage===5&&q===1)render();else reward()}
const cards=['Момчето носи сребърен часовник.','Майстор Кирил е състрадателен човек.','Действието се развива в дъждовен вторник.','Момчето живее в бедност.','Майсторът връща монетите.','Майстор Кирил проявява благородство.'];let order=[];function sortGame(){if(!placed.length)order=shuffle([0,1,2,3,4,5]);panel(head()+`<p>Изберете карта, после докоснете правилното поле. Може и да я плъзнете.</p><div class="zones">${['Пряка информация','Скрита информация'].map((v,i)=>`<div class="zone" role="button" tabindex="0" onclick="drop(${i})" onkeydown="if(event.key==='Enter')drop(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();drop(${i})">${v}<small>${placed.filter(n=>n%2===i).map(n=>'✓ '+cards[n]).join('<br>')}</small></div>`).join('')}</div><div class="cards">${order.filter(n=>!placed.includes(n)).map(n=>`<button class="tile" draggable="true" ondragstart="selectCard(${n},this)" onclick="selectCard(${n},this)">${cards[n]}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`)}function selectCard(n,b){selected=n;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}function drop(i){if(selected===null)return;if(selected%2!==i){tone(false);fb('Опитайте отново!');return}placed.push(selected);selected=null;tone(true);if(placed.length===6)reward();else{sortGame();fb('Точно така!')}}
const details=['Напуканите ръце и нежните движения','Протритото палто','Запалената настолна лампа'], meanings=['Търпение, грижа и състрадание','Бедност и труден живот','Доброта, съпричастност и надежда'];let mo=[];function matchGame(){if(!matched.length)mo=shuffle([0,1,2]);panel(head()+`<p>Изберете детайл отляво и неговото внушение отдясно.</p><div class="match"><div>${details.map((v,i)=>`<button class="tile detail ${matched.includes(i)?'correct':''}" ${matched.includes(i)?'disabled':''} onclick="selectCard(${i},this)">${illustration(i)}${v}</button>`).join('')}</div><div>${mo.map(i=>`<button class="tile ${matched.includes(i)?'correct':''}" ${matched.includes(i)?'disabled':''} onclick="match(${i})">${meanings[i]}</button>`).join('')}</div></div><div id="feedback" class="feedback"></div>`)}function match(i){if(selected===null)return;if(i!==selected){tone(false);fb('Помислете какво внушава детайлът.');return}matched.push(i);selected=null;tone(true);if(matched.length===3)reward();else{matchGame();fb('Правилно съответствие!')}}
const ev=['Момчето е с протрито палто и има само малко стотинки.','Часовникът е спомен от дядото на момчето.','Работилницата се намира зад площада.','Действието се развива във вторник.'];function evidence(){picks=[];panel(head()+`<div class="mission-layout"><div><p>Изберете две доказателства, които подкрепят извода.</p><div class="options">${shuffle([0,1,2,3]).map(i=>`<button class="option" onclick="pick(${i},this)">${ev[i]}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button class="next" onclick="checkEvidence()">Провери</button><div class="clear"></div></div>${side()}</div>`)}function pick(i,b){if(picks.includes(i)){picks=picks.filter(n=>n!==i);b.classList.remove('selected')}else if(picks.length<2){picks.push(i);b.classList.add('selected')}}function checkEvidence(){if(picks.length===2&&picks.includes(0)&&picks.includes(1)){tone(true);reward()}else{tone(false);fb('Изберете точно две подходящи доказателства.')}}function reward(){done=stage;tone(true);if(stage===5){panel(`<div class="reward"><div class="eyebrow">5 от 5 мисии</div><div class="stars">★★★★★</div>${scene(true)}<h1>Мисията е изпълнена!</h1><h2>Литературни детективи</h2><p>Разкрихте не само фактите, но и скритите послания на художествения текст.</p><button onclick="home()">Играй отново</button></div>`);return}panel(`<div class="reward"><div class="eyebrow">Мисия ${stage} изпълнена</div><div class="reward-gear">⚙</div><h2>Отлична работа!</h2><p>Получихте златно зъбно колело. Часовникът е една стъпка по-близо до възстановяването.</p><button onclick="stage++;q=0;render()">Следваща мисия →</button></div>`)}home();</script></html>
